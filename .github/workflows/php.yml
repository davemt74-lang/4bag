name: FourBag CI

on:
  push:
    branches: [main, phase-1-core-league-platform]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP lint
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Smoke checks
        run: php scripts/smoke.php
